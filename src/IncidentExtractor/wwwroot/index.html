<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Document Data Extractor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.syncfusion.com/ej2/32.1.19/tailwind3.css" rel="stylesheet" />
  <script src="https://cdn.syncfusion.com/ej2/32.1.19/dist/ej2.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f4f6; color: #111827; font-family: Inter, system-ui, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    #status { flex: 1; min-width: 200px; color: #6b7280; font-size: 14px; }
    #status.error { color: #dc2626; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; }
    section { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; min-width: 0; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #374151; text-transform: uppercase; letter-spacing: .04em; }
    #review { margin-top: 12px; float: right; }
    #spinner { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; gap: 12px;
               background: rgba(255,255,255,.75); backdrop-filter: blur(2px); font-weight: 600; }
    #spinner.on { display: flex; }
    #spinner i { width: 28px; height: 28px; border: 3px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px; } header { padding: 12px; } }
  </style>
</head>
<body>
  <header>
    <h1>Document Data Extractor</h1>
    <span id="status">Upload a PDF or screenshot to extract its key-value fields.</span>
    <input type="file" id="upload" />
  </header>
  <main>
    <section><h2>Preview</h2><div id="viewer"></div></section>
    <section>
      <h2>Extracted Data</h2>
      <div id="grid"></div>
      <button id="review" class="e-btn e-primary" disabled>Review complete</button>
    </section>
  </main>
  <div id="spinner"><i></i><span id="spinnerText">Extracting, please wait...</span></div>
  <div id="dialog"><div id="spreadsheet"></div></div>

  <script>
    const $ = id => document.getElementById(id);
    const wide = () => innerWidth > 900;
    const paneHeight = () => wide() ? 'calc(100vh - 170px)' : '480px';
    const setStatus = (t, err) => { $('status').textContent = t; $('status').className = err ? 'error' : ''; };
    const busy = (on, text) => { $('spinnerText').textContent = text || 'Extracting, please wait...'; $('spinner').classList.toggle('on', on); };

    // PDF / image preview
    ej.pdfviewer.PdfViewer.Inject(ej.pdfviewer.Toolbar, ej.pdfviewer.Magnification, ej.pdfviewer.Navigation);
    const viewer = new ej.pdfviewer.PdfViewer({
      resourceUrl: 'https://cdn.syncfusion.com/ej2/32.1.19/dist/ej2-pdfviewer-lib',
      height: paneHeight()
    });
    viewer.appendTo('#viewer');

    // Editable grid: edit values inline, delete rows completely
    ej.grids.Grid.Inject(ej.grids.Edit, ej.grids.Toolbar);
    const grid = new ej.grids.Grid({
      dataSource: [],
      height: `calc(${paneHeight()} - 56px)`,
      editSettings: { allowEditing: true, allowDeleting: true },
      toolbar: ['Edit', 'Delete', 'Update', 'Cancel'],
      columns: [
        { field: 'Id', isPrimaryKey: true, visible: false },
        { field: 'Key', headerText: 'Field', width: 180 },
        { field: 'Value', headerText: 'Value' }
      ]
    });
    grid.appendTo('#grid');

    addEventListener('resize', () => {
      viewer.height = paneHeight();
      grid.height = `calc(${paneHeight()} - 56px)`;
    });

    // Spreadsheet in a dialog, opened only when the review is finished
    let sheet;
    const dialog = new ej.popups.Dialog({
      header: 'Review & save',
      isModal: true,
      visible: false,
      showCloseIcon: true,
      width: '90%',
      height: '85%',
      target: document.body,
      closeOnEscape: true,
      open: () => {
        sheet = new ej.spreadsheet.Spreadsheet({
          height: '100%',
          saveUrl: '/api/spreadsheet/save',
          sheets: [{ name: 'Extracted Data', ranges: [{ dataSource: dialog.rows }] }]
        });
        sheet.appendTo('#spreadsheet');
      },
      close: () => { if (sheet) { sheet.destroy(); sheet = null; } }
    });
    dialog.appendTo('#dialog');

    $('review').onclick = () => {
      if (grid.isEdit) grid.endEdit();
      dialog.rows = grid.dataSource.map(r => ({ Field: r.Key, Value: r.Value }));
      dialog.show();
    };

    // File selection via the Uploader's `selected` event
    new ej.inputs.Uploader({
      autoUpload: false,
      multiple: false,
      showFileList: false,
      allowedExtensions: '.pdf,.png,.jpg,.jpeg',
      selected: async args => {
        const file = args.filesData[0] && args.filesData[0].rawFile;
        if (!file) return;
        $('review').disabled = true;
        grid.dataSource = [];
        setStatus(file.name);
        busy(true);

        // PDFs open directly in the viewer; images are shown from the PDF the server returns
        if (file.type === 'application/pdf') {
          const reader = new FileReader();
          reader.onload = () => viewer.load(reader.result, null);
          reader.readAsDataURL(file);
        }
        const body = new FormData();
        body.append('file', file);
        try {
          const res = await fetch('/api/extract', { method: 'POST', body });
          if (!res.ok) throw new Error(await res.text());
          const { fields, pdf } = await res.json();
          if (pdf) viewer.load(pdf, null);
          grid.dataSource = fields.map((f, i) => ({ Id: i, Key: f.key, Value: f.value }));
          $('review').disabled = !fields.length;
          setStatus(`${file.name} — ${fields.length} fields. Edit or delete rows, then click Review complete.`);
        } catch (err) {
          setStatus(err.message.replace(/^"|"$/g, ''), true);
        } finally {
          busy(false);
        }
      }
    }, '#upload');
  </script>
</body>
</html>
