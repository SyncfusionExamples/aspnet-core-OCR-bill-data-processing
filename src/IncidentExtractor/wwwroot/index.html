<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Invoice Data Extractor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.syncfusion.com/ej2/32.1.19/tailwind3.css" rel="stylesheet" />
  <script src="https://cdn.syncfusion.com/ej2/32.1.19/dist/ej2.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 12px; align-items: center; }
    #status { color: #555; }
    #status.error { color: #c00; }
    main { display: flex; height: calc(100vh - 62px); }
    .pane { flex: 1; padding: 12px; min-width: 0; overflow: auto; }
    .pane + .pane { border-left: 1px solid #ddd; }
    h3 { margin: 0 0 8px; }
  </style>
</head>
<body>
  <header>
    <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg" />
    <span id="status">Select an invoice (PDF or screenshot) to extract all key-value fields.</span>
  </header>
  <main>
    <section class="pane"><h3>Preview</h3><div id="viewer"></div></section>
    <section class="pane">
      <h3>Extracted Data (editable)</h3>
      <div id="grid"></div>
    </section>
  </main>

  <script>
    const viewer = new ej.pdfviewer.PdfViewer({
      resourceUrl: 'https://cdn.syncfusion.com/ej2/32.1.19/dist/ej2-pdfviewer-lib',
      height: 'calc(100vh - 130px)'
    });
    ej.pdfviewer.PdfViewer.Inject(ej.pdfviewer.Toolbar, ej.pdfviewer.Magnification, ej.pdfviewer.Navigation);
    viewer.appendTo('#viewer');

    ej.grids.Grid.Inject(ej.grids.Edit, ej.grids.Toolbar);
    const grid = new ej.grids.Grid({
      dataSource: [],
      editSettings: { allowEditing: true, mode: 'Batch' },
      toolbar: ['Update', 'Cancel'],
      columns: [
        { field: 'Id', isPrimaryKey: true, visible: false },
        { field: 'Key', headerText: 'Field', width: 200 },
        { field: 'Value', headerText: 'Value', width: 300 }
      ]
    });
    grid.appendTo('#grid');

    const status = document.getElementById('status');
    const setStatus = (t, err) => { status.textContent = t; status.className = err ? 'error' : ''; };

    document.getElementById('file').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      setStatus('Extracting...');
      const body = new FormData();
      body.append('file', file);
      // PDFs open directly in the viewer; images are shown from the PDF the server returns.
      if (file.type === 'application/pdf') {
        const reader = new FileReader();
        reader.onload = () => viewer.load(reader.result, null);
        reader.readAsDataURL(file);
      }
      try {
        const res = await fetch('/api/extract', { method: 'POST', body });
        if (!res.ok) throw new Error(await res.text());
        const { fields, pdf } = await res.json();
        if (pdf) viewer.load(pdf, null);
        grid.dataSource = fields.map((f, i) => ({ Id: i, Key: f.key, Value: f.value }));
        setStatus('Done. Double-click a value to edit.');
      } catch (err) {
        setStatus(err.message.replace(/^"|"$/g, ''), true);
      }
    });

  </script>
</body>
</html>
